<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saiph | Links</title>
    <meta name="description" content="✨ Born from stardust, made to shine among the stars ✨">
    <meta name="theme-color" content="#0c0c2a">

    <!-- Open Graph / social preview -->
    <meta property="og:title" content="Saiph | Links">
    <meta property="og:description" content="✨ Born from stardust, made to shine among the stars ✨">
    <meta property="og:image" content="https://stygianstar.github.io/bio/images/preview-image.png">
    <meta property="og:url" content="https://stygianstar.github.io/bio/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: linear-gradient(135deg, #0c0c2a 0%, #1a1a3e 50%, #2d1b69 100%);
            min-height: 100vh;
            min-height: 100dvh; /* Dynamic viewport height on mobile */
            position: relative;
            overflow-x: hidden;
        }

        /* Animated stars */
        .stars {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
            transition: translate 0.2s ease-out; /* Smooth parallax movement */
        }

        .star.small {
            width: 2px;
            height: 2px;
        }

        .star.medium {
            width: 3px;
            height: 3px;
        }

        .star.large {
            width: 4px;
            height: 4px;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Main container */
        .container {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* Profile */
        .profile {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInUp 1s ease-out both;
        }

        .profile-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.3);
            margin-bottom: 20px;
            object-fit: cover;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .profile-image:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.4);
        }

        .profile h1 {
            color: white;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .profile p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.2em;
            font-style: italic;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        /* Links container */
        .links-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Single link */
        .link-item {
            background: rgba(255, 255, 255, 0.1);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 15px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s ease;
            animation: fadeInUp 1s ease-out both; /* "both": hidden until its delay starts */
            position: relative;
            overflow: hidden;
        }

        /* Light sweep effect on hover */
        .link-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .link-item:hover,
        .link-item:focus-visible {
            transform: translateY(-5px) scale(1.02);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .link-item:focus-visible {
            outline: 2px solid white;
            outline-offset: 3px;
        }

        .link-item:hover::before,
        .link-item:focus-visible::before {
            left: 100%;
        }

        .link-icon {
            width: 60px;
            height: 60px;
            flex-shrink: 0;
            border-radius: 10px;
            object-fit: contain;
            filter: brightness(1.2) drop-shadow(0 0 15px rgba(255, 255, 255, 0.4));
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
        }

        .link-content {
            flex: 1;
        }

        .link-title {
            color: white;
            font-size: 1.3em;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 40px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9em;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .profile h1 {
                font-size: 2em;
            }

            .link-item {
                padding: 12px;
                gap: 12px;
            }

            .link-icon {
                width: 45px;
                height: 45px;
                padding: 8px;
            }

            .link-title {
                font-size: 1.1em;
            }
        }

        /* Respect the user's "reduce motion" system setting */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <!-- Animated stars -->
    <div class="stars" id="stars" aria-hidden="true"></div>

    <main class="container">
        <!-- Profile information -->
        <header class="profile">
            <img src="https://raw.githubusercontent.com/StygianStar/bio/main/images/profile.png"
                 alt="Profile picture" class="profile-image" id="profileImage"
                 width="150" height="150">
            <h1 id="profileName">Saiph</h1>
            <p id="profileBio">Poor nerd • Professional bleater • Star lover • 🇮🇹/🇧🇪</p>
        </header>

        <!-- Links container (links are generated dynamically) -->
        <nav class="links-container" id="linksContainer" aria-label="Social links"></nav>

        <footer class="footer">
            <p>✨ Born from stardust, made to shine among the stars ✨</p>
        </footer>
    </main>

    <script>
        // ========== CONFIGURATION ==========

        // Profile information
        const PROFILE_CONFIG = {
            name: "Saiph",
            bio: "Poor nerd • Professional bleater • Star lover • 🇮🇹/🇧🇪",
            image: "https://raw.githubusercontent.com/StygianStar/bio/main/images/profile.png"
        };

        // Social links
        const SOCIAL_LINKS = [
            {
                title: "Pronouns.page",
                url: "https://en.pronouns.page/@Saiph",
                icon: "https://raw.githubusercontent.com/StygianStar/bio/main/images/pronouns-page.svg"
            },
            {
                title: "Telegram",
                url: "https://t.me/saiph_uwu",
                icon: "https://raw.githubusercontent.com/StygianStar/bio/main/images/telegram.svg"
            },
            {
                title: "Twitter",
                url: "https://x.com/saiph_no_zaza",
                icon: "https://raw.githubusercontent.com/StygianStar/bio/main/images/twitter.svg"
            },
            {
                title: "BlueSky",
                url: "https://bsky.app/profile/saiphdeer.bsky.social",
                icon: "https://raw.githubusercontent.com/StygianStar/bio/main/images/bluesky.svg"
            },
            {
                title: "Fur Affinity",
                url: "https://www.furaffinity.net/user/saiphstars",
                icon: "https://raw.githubusercontent.com/StygianStar/bio/main/images/fur-affinity.svg"
            }
        ];

        // Stars configuration
        const STARS_CONFIG = {
            count: 200,          // Number of stars
            minDelay: 0,         // Minimum animation delay (seconds)
            maxDelay: 6,         // Maximum animation delay (seconds)
            parallaxStrength: 8  // Max parallax shift in px (multiplied by 1-3 per depth layer)
        };

        // ========== END CONFIGURATION ==========

        const stars = [];
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // Create the stars
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const sizes = ['small', 'medium', 'large'];
            const fragment = document.createDocumentFragment();

            for (let i = 0; i < STARS_CONFIG.count; i++) {
                const star = document.createElement('div');
                star.className = 'star';

                // Random size
                star.classList.add(sizes[Math.floor(Math.random() * sizes.length)]);

                // Random position
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';

                // Random animation delay
                const delay = Math.random() * (STARS_CONFIG.maxDelay - STARS_CONFIG.minDelay) + STARS_CONFIG.minDelay;
                star.style.animationDelay = delay + 's';

                // Random animation duration (between 2 and 5 seconds)
                star.style.animationDuration = (Math.random() * 3 + 2) + 's';

                stars.push(star);
                fragment.appendChild(star);
            }

            starsContainer.appendChild(fragment);
        }

        // Set the profile information
        function setupProfile() {
            document.getElementById('profileName').textContent = PROFILE_CONFIG.name;
            document.getElementById('profileBio').textContent = PROFILE_CONFIG.bio;
            document.getElementById('profileImage').src = PROFILE_CONFIG.image;
        }

        // Create the links (built with DOM methods, no innerHTML)
        function createLinks() {
            const container = document.getElementById('linksContainer');

            SOCIAL_LINKS.forEach((link, index) => {
                const linkElement = document.createElement('a');
                linkElement.className = 'link-item';
                linkElement.href = link.url;
                linkElement.target = '_blank';
                linkElement.rel = 'me noopener noreferrer';

                // Animation delay for staggered effect
                linkElement.style.animationDelay = (index * 0.1) + 's';

                const icon = document.createElement('img');
                icon.src = link.icon;
                icon.alt = ''; // Decorative: the title is already shown next to it
                icon.className = 'link-icon';
                icon.width = 60;
                icon.height = 60;

                const content = document.createElement('div');
                content.className = 'link-content';

                const title = document.createElement('div');
                title.className = 'link-title';
                title.textContent = link.title;

                content.appendChild(title);
                linkElement.append(icon, content);
                container.appendChild(linkElement);
            });
        }

        // Light parallax effect for stars.
        // Uses the "translate" property, which combines with the "transform: scale()"
        // of the twinkle animation instead of being overridden by it.
        function setupParallax() {
            if (reducedMotion) return;

            let ticking = false;

            document.addEventListener('mousemove', function (e) {
                if (ticking) return;
                ticking = true;

                requestAnimationFrame(() => {
                    const x = e.clientX / window.innerWidth - 0.5;
                    const y = e.clientY / window.innerHeight - 0.5;

                    stars.forEach((star, index) => {
                        const speed = (index % 3 + 1) * STARS_CONFIG.parallaxStrength;
                        star.style.translate = `${x * speed}px ${y * speed}px`;
                    });

                    ticking = false;
                });
            });
        }

        // Initialization
        document.addEventListener('DOMContentLoaded', function () {
            createStars();
            setupProfile();
            createLinks();
            setupParallax();
        });
    </script>
</body>
</html>
